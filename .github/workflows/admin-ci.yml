name: admin-ci

on:
  pull_request:
    paths:
      - "admin/**"
      - ".github/workflows/admin-ci.yml"
  push:
    branches: ["main"]

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm exec vitest run
      - run: |
          {
            echo "## Admin CI"
            echo "- typecheck: passed"
            echo "- unit/integration vitest: passed"
          } >> "$GITHUB_STEP_SUMMARY"
  page-flows:
    runs-on: ubuntu-latest
    needs: typecheck-and-unit
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:pages
      - run: |
          {
            echo "## Admin Page Flow Coverage"
            echo "- login"
            echo "- dramas"
            echo "- feed-config"
            echo "- purchases"
            echo "- entitlements"
            echo "- rtdn"
            echo "- playback"
            echo "- audit logs"
          } >> "$GITHUB_STEP_SUMMARY"
