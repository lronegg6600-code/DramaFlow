name: rollback-drill

on:
  workflow_dispatch:
    inputs:
      target_service:
        description: service to rollback
        required: true
        default: admin-service
      real_run:
        description: execute real rollback actions
        required: true
        default: "1"

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run rollback drill
        run: |
          chmod +x deployments/scripts/*.sh
          DRAMAFLOW_REAL_RUN="${{ inputs.real_run }}" \
          DRAMAFLOW_TARGET_ENV=staging \
          DRAMAFLOW_CONTROL_PLANE="${{ vars.DRAMAFLOW_CONTROL_PLANE || 'kubernetes' }}" \
          DRAMAFLOW_KUBE_NAMESPACE="${{ vars.DRAMAFLOW_KUBE_NAMESPACE || 'dramaflow-staging' }}" \
          DRAMAFLOW_EVIDENCE_DIR="${{ github.workspace }}/backend/release-evidence/rollback" \
          TARGET_SERVICE="${{ inputs.target_service }}" \
          sh deployments/scripts/run_rollback_drill.sh
      - name: Upload rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: rollback-drill-evidence
          path: backend/release-evidence/rollback
      - name: Step summary
        run: |
          echo "## Rollback drill" >> "$GITHUB_STEP_SUMMARY"
          echo "- target_service: ${{ inputs.target_service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- real_run: ${{ inputs.real_run }}" >> "$GITHUB_STEP_SUMMARY"
