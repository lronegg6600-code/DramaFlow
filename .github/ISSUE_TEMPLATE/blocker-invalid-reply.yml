name: Blocker Invalid Reply
description: Structured form when engineering rejects an input package and requests补件.
title: "[Blocker Invalid] <blocker_id>"
labels:
  - release-blocker-invalid
body:
  - type: input
    id: blocker_id
    attributes:
      label: Blocker ID
      placeholder: CA-01
    validations:
      required: true
  - type: textarea
    id: invalid_reason
    attributes:
      label: Invalid reason
      description: Be specific. Reference exact missing/invalid fields.
      placeholder: kubeconfig_path present but current_context missing; can_patch_deployments still false
    validations:
      required: true
  - type: textarea
    id: required_fix
    attributes:
      label: Required fix
      placeholder: Update cluster-access.yaml with current_context, rbac_role, can_patch_deployments=true
    validations:
      required: true
  - type: input
    id: verification_command
    attributes:
      label: Verification command
      placeholder: node backend/tests/release/validate_cluster_input_package.mjs
    validations:
      required: true
