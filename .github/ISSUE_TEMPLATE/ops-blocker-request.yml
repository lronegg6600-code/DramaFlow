name: Ops Blocker Request
description: Request cluster access or deploy tooling needed to run real staging deployment.
title: "[Release Blocker][OPS] <blocker_id> <short title>"
labels:
  - release-blocker
  - needs-ops
body:
  - type: input
    id: blocker_id
    attributes:
      label: Blocker ID
      placeholder: CA-01
    validations:
      required: true
  - type: textarea
    id: required_input
    attributes:
      label: Required input
      placeholder: kubeconfig_path / current_context / namespace / helm_version
    validations:
      required: true
  - type: textarea
    id: expected_format
    attributes:
      label: Expected format
      placeholder: YAML file in platform-intake/received/cluster-access or deploy-tooling
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: ops
    validations:
      required: true
  - type: input
    id: due_date
    attributes:
      label: Due date bucket
      placeholder: same_day
    validations:
      required: true
  - type: input
    id: verification_command
    attributes:
      label: Verification command
      placeholder: node backend/tests/release/validate_cluster_input_package.mjs
    validations:
      required: true
  - type: input
    id: evidence_output
    attributes:
      label: Evidence output path
      placeholder: release-evidence/cluster_access_input_package.json
    validations:
      required: true
