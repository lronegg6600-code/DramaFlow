name: Platform Blocker Request
description: Request platform/security/registry inputs needed to unblock DramaFlow release execution.
title: "[Release Blocker][PLATFORM] <blocker_id> <short title>"
labels:
  - release-blocker
  - needs-platform
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a blocker needs platform, security, registry, or CI input.
  - type: input
    id: blocker_id
    attributes:
      label: Blocker ID
      description: Example: AI-01, SC-08, DT-01
      placeholder: AI-01
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: platform
    validations:
      required: true
  - type: textarea
    id: required_input
    attributes:
      label: Required input
      description: Copy the exact input item required from the owner matrix.
      placeholder: image_tag / image_digest / registry_host / helm_version
    validations:
      required: true
  - type: textarea
    id: expected_format
    attributes:
      label: Expected format
      placeholder: YAML file dropped into platform-intake/received/artifact-identity/artifact-identity.yaml
    validations:
      required: true
  - type: input
    id: due_date
    attributes:
      label: Due date bucket
      placeholder: same_day
    validations:
      required: true
  - type: input
    id: verification_command
    attributes:
      label: Verification command
      placeholder: node backend/tests/release/validate_artifact_input_package.mjs
    validations:
      required: true
  - type: input
    id: evidence_output
    attributes:
      label: Evidence output path
      placeholder: release-evidence/artifact_identity_input_package.json
    validations:
      required: true
