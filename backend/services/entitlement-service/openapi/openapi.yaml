openapi: 3.1.0
info:
  title: DramaFlow Entitlement Service API
  version: 0.5.0
  description: |
    Contract markers:
    - auth.forbidden
servers:
  - url: http://localhost:8086
paths:
  /v1/entitlements/me:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user entitlements.
  /v1/entitlements/me/playback-access:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: episodeId
          required: true
          schema: { type: string }
        - in: query
          name: dramaId
          required: false
          schema: { type: string, nullable: true }
      responses:
        '200':
          description: Playback access decision.
  /v1/entitlements/grants:
    post:
      responses:
        '202':
          description: Grant accepted.
  /v1/entitlements/revoke:
    post:
      responses:
        '202':
          description: Revoke accepted.
  /v1/entitlements/recompute/{userId}:
    post:
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Recompute accepted.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
