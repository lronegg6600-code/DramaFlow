openapi: 3.1.0
info:
  title: DramaFlow Entitlement Service API
  version: 0.5.0
  description: |
    Contract markers:
    - auth.forbidden
servers:
  - url: http://localhost:8086
paths:
  /v1/entitlements/me:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user entitlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
  /v1/entitlements/me/playback-access:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: episodeId
          required: true
          schema: { type: string }
        - in: query
          name: dramaId
          required: false
          schema: { type: string, nullable: true }
      responses:
        '200':
          description: Playback access decision.
  /v1/entitlements/grants:
    post:
      responses:
        '202':
          description: Grant accepted.
  /v1/entitlements/revoke:
    post:
      responses:
        '202':
          description: Revoke accepted.
  /v1/entitlements/recompute/{userId}:
    post:
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Recompute accepted.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MeEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MeResponse'
        error:
          type: object
          nullable: true
      required:
        - data
    MeResponse:
      type: object
      properties:
        userId:
          type: string
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        isPremium:
          type: boolean
        activeProductId:
          type: string
          nullable: true
        source:
          type: string
      required:
        - userId
        - entitlements
        - isPremium
        - source
    Entitlement:
      type: object
      properties:
        entitlementId:
          type: string
        userId:
          type: string
        entitlementType:
          type: string
        scopeType:
          type: string
        scopeId:
          type: string
          nullable: true
        productId:
          type: string
        sourcePurchaseToken:
          type: string
        state:
          type: string
        startsAt:
          type: string
        endsAt:
          type: string
          nullable: true
      required:
        - entitlementId
        - userId
        - entitlementType
        - scopeType
        - productId
        - sourcePurchaseToken
        - state
        - startsAt
