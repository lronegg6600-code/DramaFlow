openapi: 3.1.0
info:
  title: DramaFlow Progress Service API
  version: 0.1.0
servers:
  - url: http://localhost:8084
paths:
  /v1/progress/episodes/{episodeId}:
    get:
      summary: Read saved progress for an episode.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EpisodeId'
      responses:
        '200':
          description: Progress data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeProgressEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      summary: Upsert saved progress for an episode.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EpisodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpsertRequest'
      responses:
        '200':
          description: Progress saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeProgressEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/history/recent:
    get:
      summary: Read recent watch history.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentHistoryEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Authorization failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ProgressUpsertRequest:
      type: object
      required: [dramaId, positionSeconds, durationSeconds]
      properties:
        dramaId:
          type: string
        positionSeconds:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          minimum: 1
        completed:
          type: boolean
    EpisodeProgress:
      type: object
      required: [userId, dramaId, episodeId, positionSeconds, durationSeconds, completed, updatedAt]
      properties:
        userId:
          type: string
        dramaId:
          type: string
        episodeId:
          type: string
        positionSeconds:
          type: integer
        durationSeconds:
          type: integer
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    RecentHistoryItem:
      type: object
      required: [dramaId, episodeId, watchedAt]
      properties:
        dramaId:
          type: string
        episodeId:
          type: string
        watchedAt:
          type: string
          format: date-time
    EpisodeProgressEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EpisodeProgress'
    RecentHistoryEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RecentHistoryItem'
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
