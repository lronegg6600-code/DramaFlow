global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: admin-service
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-service:8088"]
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8081"]
  - job_name: billing-service
    metrics_path: /metrics
    static_configs:
      - targets: ["billing-service:8087"]
  - job_name: content-service
    metrics_path: /metrics
    static_configs:
      - targets: ["content-service:8082"]
  - job_name: entitlement-service
    metrics_path: /metrics
    static_configs:
      - targets: ["entitlement-service:8086"]
  - job_name: feed-service
    metrics_path: /metrics
    static_configs:
      - targets: ["feed-service:8083"]
  - job_name: progress-service
    metrics_path: /metrics
    static_configs:
      - targets: ["progress-service:8084"]
  - job_name: playback-service
    metrics_path: /metrics
    static_configs:
      - targets: ["playback-service:8085"]
