apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dramaflow-backend.fullname" . }}-config
data:
  DRAMAFLOW_ENV: {{ .Values.global.env.DRAMAFLOW_ENV | quote }}
  DRAMAFLOW_GIN_MODE: {{ .Values.global.env.DRAMAFLOW_GIN_MODE | quote }}
  DRAMAFLOW_REDIS_ADDR: {{ .Values.global.env.DRAMAFLOW_REDIS_ADDR | quote }}
  DRAMAFLOW_JWT_ISSUER: {{ .Values.global.env.DRAMAFLOW_JWT_ISSUER | quote }}
  DRAMAFLOW_ACCESS_TOKEN_TTL: {{ .Values.global.env.DRAMAFLOW_ACCESS_TOKEN_TTL | quote }}
  DRAMAFLOW_REFRESH_TOKEN_TTL: {{ .Values.global.env.DRAMAFLOW_REFRESH_TOKEN_TTL | quote }}
  DRAMAFLOW_HTTP_READ_TIMEOUT: {{ .Values.global.env.DRAMAFLOW_HTTP_READ_TIMEOUT | quote }}
  DRAMAFLOW_HTTP_WRITE_TIMEOUT: {{ .Values.global.env.DRAMAFLOW_HTTP_WRITE_TIMEOUT | quote }}
  DRAMAFLOW_CONTENT_SERVICE_BASE_URL: {{ .Values.global.env.DRAMAFLOW_CONTENT_SERVICE_BASE_URL | quote }}
  DRAMAFLOW_FEED_SERVICE_BASE_URL: {{ .Values.global.env.DRAMAFLOW_FEED_SERVICE_BASE_URL | quote }}
  DRAMAFLOW_PLAYBACK_SERVICE_BASE_URL: {{ .Values.global.env.DRAMAFLOW_PLAYBACK_SERVICE_BASE_URL | quote }}
  DRAMAFLOW_ENTITLEMENT_SERVICE_BASE_URL: {{ .Values.global.env.DRAMAFLOW_ENTITLEMENT_SERVICE_BASE_URL | quote }}
  DRAMAFLOW_BILLING_SERVICE_BASE_URL: {{ .Values.global.env.DRAMAFLOW_BILLING_SERVICE_BASE_URL | quote }}
  DRAMAFLOW_ADMIN_SERVICE_BASE_URL: {{ .Values.global.env.DRAMAFLOW_ADMIN_SERVICE_BASE_URL | quote }}
  DRAMAFLOW_PLAYBACK_SIGNER_MODE: "dev_passthrough"
  DRAMAFLOW_PLAYBACK_URL_TTL_SECONDS: "300"
  DRAMAFLOW_PLAYBACK_HEARTBEAT_INTERVAL_SECONDS: "15"
  DRAMAFLOW_PLAYBACK_REFRESH_BEFORE_SECONDS: "45"
  DRAMAFLOW_PLAYBACK_CDN_BASE_URL: "https://storage.googleapis.com/exoplayer-test-media-0"
  GOOGLE_PLAY_PACKAGE_NAME: {{ .Values.global.env.GOOGLE_PLAY_PACKAGE_NAME | quote }}
  GOOGLE_PLAY_PUBLISHER_SCOPE: {{ .Values.global.env.GOOGLE_PLAY_PUBLISHER_SCOPE | quote }}
  BILLING_SYNC_ACK_MODE: {{ .Values.global.env.BILLING_SYNC_ACK_MODE | quote }}
  BILLING_RTDN_ENABLED: {{ .Values.global.env.BILLING_RTDN_ENABLED | quote }}
  BILLING_RTDN_PUSH_SECRET: {{ .Values.global.env.BILLING_RTDN_PUSH_SECRET | quote }}
  ENTITLEMENT_DEFAULT_PREVIEW_SECONDS: {{ .Values.global.env.ENTITLEMENT_DEFAULT_PREVIEW_SECONDS | quote }}
  ENTITLEMENT_GRACE_POLICY_ENABLED: {{ .Values.global.env.ENTITLEMENT_GRACE_POLICY_ENABLED | quote }}
  ADMIN_ALLOWED_ORIGINS: {{ .Values.global.env.ADMIN_ALLOWED_ORIGINS | quote }}
  ADMIN_ENABLE_DEV_OPERATIONS: {{ .Values.global.env.ADMIN_ENABLE_DEV_OPERATIONS | quote }}
