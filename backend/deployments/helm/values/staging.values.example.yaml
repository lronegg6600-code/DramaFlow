global:
  imagePullPolicy: IfNotPresent
  env:
    DRAMAFLOW_ENV: staging
    DRAMAFLOW_GIN_MODE: release
    DRAMAFLOW_JWT_ISSUER: staging.dramaflow.example
    DRAMAFLOW_OTEL_ENDPOINT: http://otel-collector.staging:4318/v1/traces
    DRAMAFLOW_CONTENT_SERVICE_BASE_URL: http://content-service:8082
    DRAMAFLOW_FEED_SERVICE_BASE_URL: http://feed-service:8083
    DRAMAFLOW_PLAYBACK_SERVICE_BASE_URL: http://playback-service:8085
    DRAMAFLOW_ENTITLEMENT_SERVICE_BASE_URL: http://entitlement-service:8086
    DRAMAFLOW_BILLING_SERVICE_BASE_URL: http://billing-service:8087
    DRAMAFLOW_ADMIN_SERVICE_BASE_URL: http://admin-service:8088
    ADMIN_ALLOWED_ORIGINS: https://admin.staging.dramaflow.example
  secrets:
    postgresDsn: secret://dramaflow/staging/postgres_dsn
    jwtSecret: secret://dramaflow/staging/jwt_secret
    adminSessionSecret: secret://dramaflow/staging/admin_session_secret
    adminBootstrapPassword: secret://dramaflow/staging/admin_bootstrap_password
    googlePlayServiceAccountJson: secret://dramaflow/staging/google_play_service_account_json
    billingRtdnPushSecret: secret://dramaflow/staging/billing_rtdn_push_secret

services:
  auth:
    image: registry.example.com/dramaflow/auth-service:staging-<sha>
    replicas: 2
  content:
    image: registry.example.com/dramaflow/content-service:staging-<sha>
    replicas: 2
  feed:
    image: registry.example.com/dramaflow/feed-service:staging-<sha>
    replicas: 2
  progress:
    image: registry.example.com/dramaflow/progress-service:staging-<sha>
    replicas: 2
  playback:
    image: registry.example.com/dramaflow/playback-service:staging-<sha>
    replicas: 2
  entitlement:
    image: registry.example.com/dramaflow/entitlement-service:staging-<sha>
    replicas: 2
  billing:
    image: registry.example.com/dramaflow/billing-service:staging-<sha>
    replicas: 2
  admin:
    image: registry.example.com/dramaflow/admin-service:staging-<sha>
    replicas: 2
