apiVersion: apps/v1
kind: Deployment
metadata:
  name: playback-service
  namespace: dramaflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: playback-service
  template:
    metadata:
      labels:
        app: playback-service
    spec:
      containers:
        - name: playback-service
          image: dramaflow/playback-service:0.1.0
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: dramaflow-backend-config
          env:
            - name: DRAMAFLOW_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: dramaflow-secrets
                  key: postgres-dsn
            - name: DRAMAFLOW_REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: dramaflow-backend-config
                  key: DRAMAFLOW_REDIS_ADDR
            - name: DRAMAFLOW_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dramaflow-secrets
                  key: jwt-secret
            - name: DRAMAFLOW_OTEL_ENDPOINT
              value: http://otel-collector:4318/v1/traces
            - name: DRAMAFLOW_PLAYBACK_SIGNER_MODE
              value: dev_passthrough
            - name: DRAMAFLOW_PLAYBACK_CDN_BASE_URL
              value: https://storage.googleapis.com/exoplayer-test-media-0
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8085
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8085
---
apiVersion: v1
kind: Service
metadata:
  name: playback-service
  namespace: dramaflow-backend
spec:
  selector:
    app: playback-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
