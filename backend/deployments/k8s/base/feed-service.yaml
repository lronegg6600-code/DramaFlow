apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-service
  namespace: dramaflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feed-service
  template:
    metadata:
      labels:
        app: feed-service
    spec:
      containers:
        - name: feed-service
          image: dramaflow/feed-service:0.1.0
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: dramaflow-backend-config
          env:
            - name: DRAMAFLOW_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: dramaflow-secrets
                  key: postgres-dsn
            - name: DRAMAFLOW_REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: dramaflow-backend-config
                  key: DRAMAFLOW_REDIS_ADDR
            - name: DRAMAFLOW_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dramaflow-secrets
                  key: jwt-secret
            - name: DRAMAFLOW_OTEL_ENDPOINT
              value: http://otel-collector:4318/v1/traces
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8083
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: feed-service
  namespace: dramaflow-backend
spec:
  selector:
    app: feed-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
