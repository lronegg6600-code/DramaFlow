apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: dramaflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      containers:
        - name: content-service
          image: dramaflow/content-service:0.1.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: dramaflow-backend-config
          env:
            - name: DRAMAFLOW_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: dramaflow-secrets
                  key: postgres-dsn
            - name: DRAMAFLOW_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dramaflow-secrets
                  key: jwt-secret
            - name: DRAMAFLOW_OTEL_ENDPOINT
              value: http://otel-collector:4318/v1/traces
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8082
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
  namespace: dramaflow-backend
spec:
  selector:
    app: content-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
